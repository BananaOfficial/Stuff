  <body class="">
    <div class="min-h-screen bg-[#010114] p-[2vw] text-[.98rem] text-zinc-100">

      <!---->

        <section class="mx-auto mb-1 flex h-[min(44rem,_calc(100vh_-_6.8rem))] min-h-[28rem] w-full max-w-full flex-col overflow-hidden rounded-lg border border-white/10 bg-neutral-950/90 text-neutral-200 shadow-2xl shadow-black/40 sm:mb-1.5">
          <div role="log" aria-live="polite" class="flex-1 [scrollbar-width:thin] [scrollbar-color:#3f3f46_transparent] space-y-8 overflow-y-auto px-4 py-6 sm:px-8 sm:py-8" id="msg">
            <!-- USER MESSAGE -->
            <div class="flex justify-end">
              <div class="max-w-[70%] rounded-md border border-white/10 bg-neutral-800/70 px-4 py-2.5 text-[15px] leading-relaxed text-neutral-100 sm:max-w-[75%] [&_code]:rounded [&_code]:border [&_code]:border-white/10 [&_code]:bg-neutral-900 [&_code]:px-1.5 [&_code]:py-0.5 [&_code]:font-['JetBrains_Mono'] [&_code]:text-[13px] [&_code]:tracking-[.04em] [&_code]:text-neutral-100 [&_p]:break-words [&_p]:whitespace-pre-wrap [&_pre]:-mt-2.5 [&_pre]:overflow-x-auto [&_pre]:rounded-md [&_pre]:border [&_pre]:border-white/20 [&_pre]:bg-[#121212] [&_pre]:p-2 sm:[&_pre]:-mt-3 [&_pre_code]:border-0 [&_pre_code]:bg-transparent [&_pre_code]:p-0">
                <p></p>
              </div>
            </div>

            <!-- ASSISTANT MESSAGE -->
            <div class="max-w-none border-r border-l border-white/20 p-[20px] pt-0.5 pb-0.5 text-[15px] leading-7 text-neutral-300 transition duration-400 sm:pl-3.5 [&_a]:text-neutral-100 [&_a]:underline [&_a]:decoration-sky-300 [&_a]:decoration-[1.5px] [&_a]:underline-offset-4 [&_blockquote]:border-r-2 [&_blockquote]:border-white/20 [&_blockquote]:pr-4 [&_blockquote]:italic [&_code]:rounded [&_code]:border [&_code]:border-white/10 [&_code]:bg-neutral-900 [&_code]:px-1.5 [&_code]:py-0.5 [&_code]:font-['JetBrains_Mono'] [&_code]:text-[13px] [&_code]:tracking-[.04em] [&_code]:text-neutral-100 [&_del]:decoration-1 [&_em]:italic [&_h1]:text-3xl [&_h1]:leading-tight [&_h1]:font-bold [&_h2]:text-2xl [&_h2]:leading-tight [&_h2]:font-semibold [&_h3]:text-xl [&_h3]:leading-tight [&_h3]:font-semibold [&_h4]:text-[1rem] [&_h4]:font-semibold [&_h5]:font-semibold [&_h6]:font-medium [&_hr]:mb-0.5 [&_hr]:border-t-2 [&_hr]:border-white/25 [&_img]:h-auto [&_img]:max-w-[90%] [&_input[type=checkbox]]:mr-1.5 [&_input[type=checkbox]]:translate-y-[0.115rem] [&_li]:-mt-1 [&_li]:wrap-break-word [&_ol]:ml-6 [&_ol]:list-decimal [&_ol]:space-y-1 [&_p]:wrap-break-word [&_pre]:overflow-x-auto [&_pre]:rounded-md [&_pre]:border [&_pre]:border-white/20 [&_pre]:bg-[#191919] [&_pre]:p-4 [&_pre_code]:border-0 [&_pre_code]:bg-transparent [&_pre_code]:p-0 [&_strong]:font-semibold [&_strong]:text-neutral-100 [&_table]:w-full [&_table]:border-collapse [&_table]:bg-[oklch(12%_0_none)] [&_td]:border [&_td]:border-white/14 [&_td]:px-2.5 [&_td]:py-2 [&_th]:border [&_th]:border-white/14 [&_th]:px-3 [&_th]:py-2 [&_th]:font-semibold [&_ul]:ml-6 [&_ul]:list-disc [&_ul]:space-y-1 [&>*+*]:mt-2">

            </div>
          </div>

          <div class="border-t border-white/10 p-3 sm:p-4">
            <div class="flex items-end gap-2 rounded-md border border-white/10 bg-neutral-900 px-3 py-2 transition-colors focus-within:border-white/30">
              <textarea rows="1" placeholder="Ask AI..." aria-label="Message" class="max-h-20 min-h-[2.25rem] flex-1 resize-none bg-transparent py-1.5 text-[15px] leading-6 text-neutral-100 placeholder:text-neutral-500 focus:outline-none"></textarea>
              <button type="button" aria-label="Send" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-md bg-cyan-100 text-neutral-900 transition duration-400 hover:-translate-y-[1px] hover:bg-cyan-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
                  <path d="M10 16V4M5 9l5-5 5 5" />
                </svg>
              </button>
            </div>
          </div>
        </section>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-4 border-t-2 border-white/[.14] py-3.5 pt-2 text-xs text-zinc-500">
